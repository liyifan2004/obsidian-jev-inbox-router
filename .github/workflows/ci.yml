# CI for JEV Inbox Router.
#
# Runs the same gate the project uses locally (`npm run verify`):
#   typecheck (tsc) → vitest → esbuild build
#
# Every push and pull request runs this. It is deliberately separate from the
# release workflow: CI proves the tree is green, the release workflow proves
# the published artifacts were built from this exact tree.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint —— 与 Obsidian 商店审查同一份规则集（eslint-plugin-obsidianmd）。
      #
      # 本插件已在社区商店列表里。把官方规则集接进 CI，
      # 「设置标题含插件名」「用 createEl("h2") 造标题」「没实现 getSettingDefinitions()」
      # 这些审查意见会在**提交时**被拦下，
      # 而不是等发版后被商店审查打回、从列表里下架。
      - name: Lint
        run: npm run lint

      # CSS lint —— 与 Obsidian 商店审查同一份规则集。
      #
      # 本插件已在社区商店列表里。把 stylelint-config-obsidianmd 接进 CI，
      # !important 与 :has() 这两类问题会在**提交时**被拦下，
      # 而不是等发版后被商店审查打回、从列表里下架。
      - name: CSS lint
        run: npm run lint:styles

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
