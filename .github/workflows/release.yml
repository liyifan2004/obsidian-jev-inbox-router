# Build and release.
#
# Trigger: push a bare-semver tag, e.g. `git tag 0.2.1 && git push origin 0.2.1`.
#
# The release assets (main.js / manifest.json / styles.css) are built HERE —
# never upload locally built assets to a public release, because that breaks
# the provenance chain this workflow establishes. Every asset is signed with
# the workflow's OIDC identity and published to Sigstore's transparency log:
#
#   gh attestation verify main.js -R liyifan2004/obsidian-jev-inbox-router
#
# Obsidian's plugin review scanner checks these attestations on every release.

name: Build and release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub release
  id-token: write # mint the OIDC token used to sign the attestation
  attestations: write # publish the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build plugin
        run: npm run build

      # Verify the tag matches manifest.json, so a release can never publish
      # a version number that disagrees with the manifest Obsidian reads.
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "tag $TAG != manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            main.js manifest.json styles.css
